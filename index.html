<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas 打磚塊</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-container">
    <h1>Canvas 打磚塊</h1>
    <p class="instructions">使用 ← → 控制板子，球掉落後按空白鍵重新開始</p>

    <!-- 遊戲畫面由 JavaScript 畫在這個 Canvas 上。 -->
    <canvas id="gameCanvas" width="800" height="600" aria-label="打磚塊遊戲畫面">
      你的瀏覽器不支援 Canvas，請改用較新的瀏覽器。
    </canvas>
  </main>

  <script src="game.js"></script>
</body>
</html>
